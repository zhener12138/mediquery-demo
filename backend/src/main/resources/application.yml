# Dotenv
spring.dotenv.path: ./.env

spring:
  application:
    name: mediquery
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/mediquery?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
    valid: 5
    title: "${MAIL_FROM_NAME:医问通 - 用户认证}"
    template: "您的动态验证码为：<strong style='color: red'>%s</strong>，%d分钟内有效，若非本人操作，请勿泄露。"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 走 slf4j 而不是 StdOutImpl：
    # StdOutImpl 直接往 System.out 打，绕开了 logback，
    # 结果 SQL 日志既没有级别、也不带 traceId，没法跟请求对上。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

logging:
  level:
    com.mediquery: debug
  # 日志文件落在哪。相对路径是相对进程工作目录（Docker 里就是 /app）。
  # logback-spring.xml 通过 springProperty 读这个值，不要在两处分别硬编码。
  file:
    path: ${LOG_PATH:logs}

# Actuator —— 只暴露 health 与 info
#
# 为什么只开这两个：
#   metrics/prometheus/env/beans 这些端点会吐出内部实现细节（bean 名、环境变量键、
#   JVM 参数），在一个对外可访问的端口上等于把架构图送人。真要做监控，
#   应当由独立的运维网络访问、加独立鉴权，而不是顺手挂在业务端口上。
#
# health 的细节默认是 never（只返回 {"status":"UP"}），不是为了好看——
# 探针只该回答"能不能干活"，不该回答"数据库密码是哪个"。
#
# Docker healthcheck 打的就是 /actuator/health，见 docker-compose.yml。
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false
  health:
    mail:
      # 关掉邮件健康检查。
      #
      # 这不是"眼不见为净"。实测发现：spring-boot-starter-mail 会自动注册
      # MailHealthIndicator，它连不上 SMTP 就报 DOWN，而 HealthEndpoint 的聚合规则是
      # 「任一 indicator 为 DOWN，整体即 DOWN」，于是整个服务对外显示 unhealthy。
      #
      # 后果是灾难性的等比放大：邮件服务器抖一下 → 容器被判 unhealthy →
      # Docker 反复重启容器 / 负载均衡把它摘出 → 一个"验证码发不出去"的小故障，
      # 变成"整个网站 502"的大事故。
      #
      # 判断依据：邮件不是处理请求的必要依赖。请求链路（查疾病、问诊、AI 对话）
      # 一条都不经过 SMTP，邮件只在注册发验证码时用一次。
      # 探针回答的问题是"这实例能不能接流量"，不是"所有外部依赖都好吗"。
      #
      # 想监控邮件可用性，正确做法是单独做告警（比如定时任务发一封自测信），
      # 而不是让它参与 readiness 判定。
      enabled: false

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# JWT
jwt:
  # 没有默认值：未配置时应用启动失败。默认值会进仓库，等于把签名密钥公开，
  # 任何人都能伪造管理员 token。生成方式：openssl rand -base64 48
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# 阿里云通义千问 (DashScope) — AI 医生
ai:
  dashscope:
    api-key: ${AI_DASHSCOPE_API_KEY}
    # 模型名可配置：不同账号对不同模型的配额/开通状态不同。
    # qwen-turbo 免费额度用完会返回 429 Throttling.RateQuota，此时可换成 qwen-plus。
    model: ${AI_DASHSCOPE_MODEL:qwen-turbo}

# 阿里云 OSS — 文件上传
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME}

# 跨域白名单 — 前端独立部署时允许访问后端的源
# 多个源用英文逗号分隔，支持 https://*.example.com 这种子域通配
# 注意：不要写成单个 *，那等于放开通配，会让这里失去意义
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# RAG 召回策略
#   fulltext（默认）= 一条 MATCH ... AGAINST 走 ft_illness / ft_medicine 全文索引
#   like            = 退回到 OR LIKE 拼接（H2 测试环境用，H2 没有 MATCH 函数）
#
# 实测对比（50000 行合成数据，MySQL 8.0.37，ngram_token_size=2）：
#
#   形状                                 OR LIKE      FULLTEXT
#   3 关键词 + ORDER BY + LIMIT 50       140~190ms    51~69ms
#   8 关键词 + ORDER BY + LIMIT 50       485ms        371~390ms
#   1 关键词（命中 5000 行）            81ms         22ms
#   稀疏关键词（命中 7 行）             50ms         <1ms
#
#   执行计划：LIKE → type=ALL rows=49586（全表扫描）
#             FULLTEXT → type=fulltext key=ft_illness
#
# 结论：命中行少时 FULLTEXT 快一个数量级；命中行极多（>1 万）时两者都要
# 对结果集 filesort，差距缩小到 1.3 倍 —— 但 FULLTEXT 仍不慢于 LIKE，
# 且它带来的是"数据库侧按相关度排序"，这是 LIKE 给不了的。
mediquery:
  retrieval:
    strategy: ${RETRIEVAL_STRATEGY:fulltext}
