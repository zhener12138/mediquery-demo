# Dotenv
spring.dotenv.path: ./.env

spring:
  application:
    name: mediquery
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/mediquery?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
    valid: 5
    title: "${MAIL_FROM_NAME:医问通 - 用户认证}"
    template: "您的动态验证码为：<strong style='color: red'>%s</strong>，%d分钟内有效，若非本人操作，请勿泄露。"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 走 slf4j 而不是 StdOutImpl：
    # StdOutImpl 直接往 System.out 打，绕开了 logback，
    # 结果 SQL 日志既没有级别、也不带 traceId，没法跟请求对上。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

logging:
  level:
    com.mediquery: debug
  # 日志文件落在哪。相对路径是相对进程工作目录（Docker 里就是 /app）。
  # logback-spring.xml 通过 springProperty 读这个值，不要在两处分别硬编码。
  file:
    path: ${LOG_PATH:logs}

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# JWT
jwt:
  # 没有默认值：未配置时应用启动失败。默认值会进仓库，等于把签名密钥公开，
  # 任何人都能伪造管理员 token。生成方式：openssl rand -base64 48
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# 阿里云通义千问 (DashScope) — AI 医生
ai:
  dashscope:
    api-key: ${AI_DASHSCOPE_API_KEY}
    # 模型名可配置：不同账号对不同模型的配额/开通状态不同。
    # qwen-turbo 免费额度用完会返回 429 Throttling.RateQuota，此时可换成 qwen-plus。
    model: ${AI_DASHSCOPE_MODEL:qwen-turbo}

# 阿里云 OSS — 文件上传
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME}

# 跨域白名单 — 前端独立部署时允许访问后端的源
# 多个源用英文逗号分隔，支持 https://*.example.com 这种子域通配
# 注意：不要写成单个 *，那等于放开通配，会让这里失去意义
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
