version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mediquery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      LANG: C.UTF-8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 不再挂载 init.sql：建表交给 Flyway（backend 启动时跑 db/migration）。
      # 这里的入口脚本只在数据卷为空时执行一次，而 Flyway 要在后端启动时才跑，
      # 时序对不上——挂 seed.sql 进去会在表还不存在时 INSERT 而失败。
      # 需要种子数据：等后端起来后手动 mysql mediquery < backend/src/main/resources/db/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediquery-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: mediquery-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据源
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&characterSetResults=utf8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 邮箱
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # DashScope AI
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      # 阿里云 OSS
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME}
    ports:
      - "8088:8080"
    # 探针打 actuator，不打业务接口。
    # 打业务接口的问题：/api/v1/stats 在数据库连不上时会返回 500，容器判定 unhealthy 是对的；
    # 但反过来，一个需要认证的接口返回 401 也会被判成 unhealthy —— 那说明的是"探针写错了"，
    # 不是"服务挂了"。health 端点回答的是同一个问题，而且答案更准（它自己会检查 DataSource）。
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: mediquery-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
