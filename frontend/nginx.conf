server {
    listen       80;
    server_name  localhost;
    charset      utf-8;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 专用：/consultations/{id}/messages/stream 走 text/event-stream，下面几条缺一不可。
        #
        # proxy_buffering off —— 不能少。nginx 默认攒够 buffer 才往下发，
        #   而 SSE 要的是"生成一个 token 就推一个"。开着缓冲用户会盯着转圈，
        #   然后整段文字一次蹦出来，流式等于白做。
        #
        # proxy_read_timeout —— 默认 60s。AI 回答一段长内容可能超过，
        #   超了 nginx 直接断开，前端表现为"说到一半没了"。
        #
        # proxy_http_version 1.1 + Connection '' —— SSE 需要长连接，
        #   HTTP/1.0 下 nginx 按短连接处理，流推一半就断。
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     180s;
        proxy_send_timeout     180s;
        proxy_http_version     1.1;
        proxy_set_header       Connection '';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
    # 注意 gzip_types 里刻意没有 text/event-stream：压缩会让 nginx 重新引入缓冲，
    # 上面 proxy_buffering off 就白设了。
}
