name: CI

# 只保留一条规则：每次 push 到 main 和每个 PR 都必须通过。
# 加阈值、加覆盖率门槛之前，先确保"能跑起来"这件事本身是可靠的。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 为什么要 extra 这一步：CI 上没有任何 .env 文件，而 application.yml 里有
      # spring.dotenv.path=./.env。dotenv 找不到文件会打 WARN 但不中断，所以测试能跑。
      # 这里显式声明一下，避免将来有人以为 CI 是靠 .env 跑起来的。
      - name: Run tests
        working-directory: backend
        run: mvn -B -ntp test

      # 失败时把 surefire 报告打出来。默认的 mvn -B 只给一行汇总，
      # 具体哪个断言挂了还得点进 artifacts 看，很费时间。
      - name: Show failing tests
        if: failure()
        working-directory: backend
        run: |
          echo "=== surefire reports ==="
          find target/surefire-reports -name '*.txt' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Build jar (skip tests, already ran)
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 类型检查。这是当前前端唯一能做的"非运行时"验证——
      # 项目没有任何前端测试框架（vitest/jest 都不在 devDependencies 里）。
      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Report bundle size
        working-directory: frontend
        run: |
          echo "=== dist sizes (KB) ==="
          find dist/assets -name '*.js' -o -name '*.css' | xargs -r du -k | sort -rn | head -10

  # 一个显式的"全部通过"门禁。branch protection 只需要盯这一个 job，
  # 将来加 job 不用重复改保护规则。
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - run: echo "所有检查通过"
