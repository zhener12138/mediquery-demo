{% extends "base.html" %}
{% block body_class %}{% endblock %}
{% block back %}{% include "common/back.html" %}{% endblock %}
{% block content %}

<div id="dashboard">
    <div class="container">
        <div class="dashboard-main">
            <div class="row">
                <div class="col-lg-3 col-md-12 col-sm-12 col-xs-12">
                    {% with cur='profile' %}{% include "common/sidebar.html" %}{% endwith %}
                </div>
                <div class="col-lg-9 col-md-12 col-sm-12 col-xs-12">
                    <div class="dashboard-content">
                        <div class="dashboard-form mb-4">
                            <div class="row">
                                <div class="col-lg-12 col-md-12 col-xs-12 padding-right-30">
                                    <div class="dashboard-list">
                                        <h4 class="gray">我的资料</h4>
                                        <div class="dashboard-list-static">
                                            <div class="edit-profile-photo">
                                                <img id="img-preview" src="{{ loginUser.img_path if loginUser else '/static/assets/images/default-avatar.svg' }}" alt="" onerror="this.onerror=null;this.src='/static/assets/images/default-avatar.svg'">
                                                <div class="change-photo-btn">
                                                    <div class="photoUpload">
                                                        <span><i class="fa fa-upload"></i> 点击上传</span>
                                                        <input id="img-file" type="file" class="upload" onchange="uploadPhoto()">
                                                        <input style="display:none" id="img" value="{{ loginUser.img_path if loginUser else '' }}" type="text">
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="my-profile">
                                                <div class="row">
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label>账户名称</label>
                                                            <input style="background:#ecf0f1" disabled value="{{ loginUser.user_account if loginUser else '' }}" type="text">
                                                            <input id="userId" style="display:none" value="{{ loginUser.id if loginUser else '' }}" type="text">
                                                        </div>
                                                    </div>
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label>真实姓名</label>
                                                            <input id="userName" value="{{ loginUser.user_name if loginUser else '' }}" type="text">
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label>性别</label>
                                                            <input disabled style="background:#ecf0f1" value="{{ loginUser.user_sex if loginUser else '' }}" type="text">
                                                        </div>
                                                    </div>
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label>年龄</label>
                                                            <input id="userAge" value="{{ loginUser.user_age if loginUser else '' }}" type="number">
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label>邮箱</label>
                                                            <input style="background:#ecf0f1" disabled value="{{ loginUser.user_email if loginUser else '' }}" type="text">
                                                        </div>
                                                    </div>
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label>手机号</label>
                                                            <input id="userTel" value="{{ loginUser.user_tel if loginUser else '' }}" type="number">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div>
                                                <button class="btn btn-na" onclick="updateProfile()">保存修改</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="dashboard-form mb-4">
                            <div class="dashboard-password">
                                <h4>修改登录密码</h4>
                                <div class="row">
                                    <div class="col-lg-4 col-md-12 col-sm-12 col-xs-12">
                                        <div class="form-group">
                                            <label>当前密码</label>
                                            <input id="oldPassword" type="password" placeholder="">
                                        </div>
                                    </div>
                                    <div class="col-lg-4 col-md-12 col-sm-12 col-xs-12">
                                        <div class="form-group">
                                            <label>新密码</label>
                                            <input id="password1" type="password">
                                        </div>
                                    </div>
                                    <div class="col-lg-4 col-md-12 col-sm-12 col-xs-12">
                                        <div class="form-group">
                                            <label>确认密码</label>
                                            <input id="password2" type="password">
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="mt-2">
                                            <button onclick="updatePassword()" class="btn btn-na">修改密码</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
